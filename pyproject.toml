[project]
name = "puro-pockets"
version = "0.1.0"
description = "Finanzas personales con Claude: servidor MCP y base de datos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=25.1",
    "tzdata>=2026.6",
    "fastapi>=0.162.5",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puro_pockets"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requiere los servicios levantados (docker compose up)",
]
